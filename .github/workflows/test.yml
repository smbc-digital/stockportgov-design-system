name: Test application

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup Node.js environment
      uses: actions/setup-node@v2.1.2
      with:
        node-version: '18.16.0'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test
